spring.application.name=${SPRING_APPLICATION_NAME:DVD-Library}
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?autoReconnect=true&connectTimeout=30000
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# HikariCP connection pool settings
# Minimum number of idle connections
spring.datasource.hikari.minimum-idle=5
# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=10
# Connection timeout in milliseconds (30 seconds)
spring.datasource.hikari.connection-timeout=30000
# Idle timeout (10 minutes)
spring.datasource.hikari.idle-timeout=600000
# Maximum lifetime of a connection (30 minutes)
spring.datasource.hikari.max-lifetime=1800000
